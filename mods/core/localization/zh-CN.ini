explanation.formula_unknown = "此类计算暂未配置专门说明。展开原始记录可查看完整输入、步骤和结果。"
explanation.commodity_scarce = "当前库存低于目标库存，稀缺因素会推高目标价；最终报价仍会受到市场波动和渐进调整影响。"
explanation.commodity_surplus = "当前库存高于目标库存，充裕供应会压低目标价；最终报价仍会受到市场波动和渐进调整影响。"
explanation.commodity_balanced = "当前库存与目标库存相同，稀缺因素没有推高或压低目标价；市场波动仍可能带来报价变化。"
explanation.security_price = "报价同时受发行方产出信号与市场波动影响；单日变动限制为 ±12%，价格保持在初始价的 0.1–10 倍范围内。"
explanation.colony_production = "稳定度影响计划产能；原料不足时，设施会按最紧缺的投入品缩减生产批次。实际消耗和产出以本次结算结果为准。"
explanation.market_settled = "这个市场本游戏日的商品与证券报价已经更新。这是固定的每日结算记录，不代表重复执行。"
explanation.war_advanced = "这场仍在进行的战争已推进一个游戏日，持续天数随之增加。"
explanation.colony_production_event = "这座殖民地已经完成本周生产结算。设施的具体产量与原料限制可在「殖民地与生产」页面查看。"
explanation.event_driven = "此类事件由具体命令、模组或条件触发，不属于统一的每日或每周结算。"

