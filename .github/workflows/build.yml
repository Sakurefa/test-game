name: Test and Build Game Source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: game-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Electron and simulation syntax
        run: npm run check:syntax
      - name: Test simulation and Mod loader
        run: npm test
      - name: Build renderer
        run: npm run build:web
      - name: Commit generated renderer files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(build): update renderer output"
            git pull --rebase origin main
            git push
          }
