[mod]
id = core
name = "Frontier Core"
version = 0.2.0
author = "Sakurefa"
description = "Required base content for the multi-system frontier simulation."
api_version = 4

[files]
registry = registry.ini;definitions.ini
content = core.ini;universe.ini;economy.ini;factions.ini;military.ini;events.ini;population.ini;finance.ini
localization = zh-CN.ini
scripts = simulation.js

[hooks]
core.simulation.production = simulation.js:onWeeklyProduction
core.simulation.needs = simulation.js:onDailyNeeds
core.simulation.market = simulation.js:onDailyMarketPricing
core.simulation.war = simulation.js:onDailyWarChronology

[formulas]
economy.population-needs = simulation.js:formulaPopulationNeeds:2
economy.colony-production = simulation.js:formulaColonyProduction:1
economy.commodity-price = simulation.js:formulaCommodityPrice:3
economy.security-price = simulation.js:formulaSecurityPrice:3

[systems]
colony-production = weekly:10:-:core.simulation.production
population-needs = daily:15:core.colony-production:core.simulation.needs
market-pricing = daily:20:core.population-needs:core.simulation.market
war-chronology = daily:30:-:core.simulation.war
