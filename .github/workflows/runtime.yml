name: Prepare Electron Runtime and Launcher
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: electron-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-runtime:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test Mod loader
        run: npm test
      - name: Build renderer
        run: npm run build:web
      - name: Prepare minimal Electron app
        shell: pwsh
        run: ./scripts/prepare-electron-app.ps1
      - name: Build Windows Electron runtime
        run: npx electron-builder --win dir --publish never
      - name: Copy runtime dependencies into repository
        shell: pwsh
        run: ./scripts/sync-electron-runtime.ps1
      - name: Commit runtime files and renderer
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f dist
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(runtime): sync Electron runtime dependencies"
            git push
          }
      - name: Upload standalone launcher EXE
        uses: actions/upload-artifact@v4
        with:
          name: Market-Simulator-Launcher-EXE
          path: release/win-unpacked/Market Simulator.exe
          if-no-files-found: error
          retention-days: 14
